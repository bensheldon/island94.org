name: New Bookmark
on:
  workflow_dispatch:
    inputs:
      bookmark_link:
        description: 'URL'
        required: true
        type: string
      bookmark_title:
        description: 'Title'
        required: false
        type: string
      bookmark_tags:
        description: 'Tags'
        required: false
        type: string
      bookmark_notes:
        description: 'Notes'
        required: false
        type: string
jobs:
  new_bookmark:
    name: Create new bookmark and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # Dependencies
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Generate new bookmark
        env:
          BOOKMARK_LINK: ${{ github.event.inputs.bookmark_link }}
          BOOKMARK_TITLE: ${{ github.event.inputs.bookmark_title }}
          BOOKMARK_TAGS: ${{ github.event.inputs.bookmark_tags }}
          BOOKMARK_NOTES: ${{ github.event.inputs.bookmark_notes }}
        run: bundle exec rake new_bookmark
      - name: Create commit
        run: |
          git config user.name $GITHUB_ACTOR
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add --all _bookmarks/
          git commit -m "Add bookmark for ${{ github.event.inputs.bookmark_link }}"
      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          title: "Add bookmark for ${{ github.event.inputs.bookmark_link }}"
          body: ""
          branch-suffix: timestamp
          add-paths: |
            _bookmarks/

      - name: PR Details
        run: |
          echo "- Pull Request Number - ${{ steps.create_pr.outputs.pull-request-number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pull Request URL - ${{ steps.create_pr.outputs.pull-request-url }}" >> $GITHUB_STEP_SUMMARY
